tools:
  - name: clarify
    description: "Gửi câu hỏi cho người dùng để làm rõ khi thông tin yêu cầu bị thiếu (như mã tài sản, mã nhân viên, hoặc hỏi xác nhận)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ thông tin thiếu hoặc hỏi xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật hoặc tài liệu hướng dẫn tự phục vụ trong Knowledge Base."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc câu hỏi cần tìm hướng dẫn"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room, network], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái tình trạng hệ thống chung của dịch vụ dùng chung (VPN, Email, SSO, Wifi, Printing)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ dùng chung"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường triển khai"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và chẩn đoán trạng thái kỹ thuật của một thiết bị cụ thể theo mã tài sản (asset_id)."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị, ví dụ LT-204, DT-101"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software, email], default: "all", description: "Hạng mục chẩn đoán"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên trong danh bạ hỗ trợ và danh sách các thiết bị được cấp theo mã nhân viên (employee_id)."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã định danh nhân viên, ví dụ EMP-1003"}
      required: [employee_id]

  - name: format_incident_report
    description: "Tổng hợp các kết quả chẩn đoán sự cố sẵn có thành báo cáo kỹ thuật."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã chẩn đoán trước đó"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu trình bày báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [findings, template]

  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm kiếm quy định và chính sách IT nội bộ của Northstar Labs."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa chính sách cần tra cứu"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ kỹ thuật trên hệ thống sau khi người dùng đã xác nhận đồng ý tạo ticket."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: true, description: "Đã được người dùng xác nhận đồng ý"}
      required: [summary]
