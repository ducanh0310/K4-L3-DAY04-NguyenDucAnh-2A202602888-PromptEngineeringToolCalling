# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "BẮT BUỘC DÙNG khi người dùng chưa cung cấp mã máy (asset_id), chưa cung cấp mã nhân viên (employee_id), dùng môi trường không hợp lệ (như demo), hoặc khi người dùng yêu cầu tạo hay chỉnh sửa ticket để xin xác nhận trước khi thực hiện."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn kỹ thuật. Luôn chọn đúng danh mục cụ thể (ví dụ: 'email' khi hỏi về Outlook/Webmail, 'vpn' khi hỏi về mạng riêng ảo) thay vì để mặc định 'all'."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ dùng chung. CHỈ HỖ TRỢ môi trường 'production' hoặc 'staging'. Nếu người dùng yêu cầu môi trường khác (như demo, dev, test), KHÔNG ĐƯỢC GỌI tool này mà phải gọi clarify để người dùng chọn lại."
    parameters:
      type: object
      properties:
        service:
          type: string
          enum: [vpn, email, sso, wifi, printing]
          description: "Tên dịch vụ."
        environment:
          type: string
          enum: [production, staging]
          default: "production"
          description: "Môi trường triển khai."
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chẩn đoán một thiết bị. CHỈ GỌI KHI CÓ MÃ MÁY CỤ THỂ (bắt đầu bằng LT- hoặc DT-). TUYỆT ĐỐI KHÔNG DÙNG cho mã nhân viên (EMP-) hoặc các từ chung như 'laptop', 'máy tính' (gặp trường hợp này phải gọi clarify)."
    parameters:
      type: object
      properties:
        asset_id:
          type: string
          description: "Mã tài sản hợp lệ (bắt buộc phải có dạng LT-xxx hoặc DT-xxx)."
        check:
          type: string
          enum: [all, network, vpn, security, hardware, software]
          default: "all"
          description: "Phạm vi kiểm tra. Chọn đúng mục liên quan (ví dụ 'vpn' cho sự cố VPN, 'network' cho mạng Wi-Fi); chỉ dùng 'all' khi kiểm tra tổng thể."
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin người dùng trong danh bạ nội bộ theo mã nhân viên cụ thể. CHỈ GỌI tool này một mình, không tự ý gọi kèm inspect_device."
    parameters:
      type: object
      properties:
        employee_id:
          type: string
          description: "Mã nhân viên thật gồm 4 chữ số (ví dụ EMP-1001, EMP-1003). TUYỆT ĐỐI KHÔNG truyền chuỗi placeholder 'EMP-xxxx' hay tên phòng ban (nếu thiếu mã thật, phải gọi clarify)."
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ. CỰC KỲ NGUY HIỂM: KHÔNG ĐƯỢC PHÉP GỌI nếu người dùng vừa mới yêu cầu tạo hoặc vừa mới thay đổi mức ưu tiên/nội dung. Trong những trường hợp đó, BẮT BUỘC phải gọi clarify(yes_no) trước để xác nhận."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true khi người dùng đã duyệt"}
      required: [summary]
